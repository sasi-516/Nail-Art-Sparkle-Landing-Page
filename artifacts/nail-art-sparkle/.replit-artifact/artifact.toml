kind = "web"
previewPath = "/"
title = "Nail Art Sparkle"
description = "A conversion-focused bridal and beauty nail salon landing page for ad traffic, with booking CTAs, service-specific WhatsApp links, urgency messaging, reviews, FAQs, and responsive layouts."
version = "1.0.0"
id = "artifacts/nail-art-sparkle"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18620

[services.development]
run = "pnpm --filter @workspace/nail-art-sparkle run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nail-art-sparkle", "run", "build" ]
serve = "static"
publicDir = "artifacts/nail-art-sparkle/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18620"
BASE_PATH = "/"
